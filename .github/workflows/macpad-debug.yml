name: MacPad Debug IPA

on:
  push:
    branches:
      - macpad-debug
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install build tools
        run: |
          brew install ninja pkgconf glib pixman libslirp qemu

      - name: Fetch iOS dependencies
        run: scripts/fetch-ios-deps.sh

      - name: Build patched QEMU + Reims
        run: scripts/build-ios.sh

      - name: Build Orchard IPA
        env:
          ORCHARD_NO_ICON: "1"
          ORCHARD_NO_NSIO: "1"
        run: ios/app/build.sh

      - name: Upload MacPad debug IPA
        uses: actions/upload-artifact@v4
        with:
          name: Orchard-MacPad-Debug
          path: ios/app/Orchard.ipa
          if-no-files-found: error
