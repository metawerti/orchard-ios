name: IPA8 Cal2 Calibration

on:
  push:
    branches:
      - ipa8-cal2
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install build tools
        run: |
          brew install ninja pkgconf glib pixman libslirp qemu

      - name: Fetch iOS dependencies
        run: scripts/fetch-ios-deps.sh

      - name: Build patched QEMU + Reims
        run: |
          set -o pipefail
          scripts/build-ios.sh 2>&1 | tee ipa8-qemu-build.log
          grep -F 'ipa8-cal2' qemu/target/arm/tcg/psci.c
          grep -F 'MACPAD_RESET_CAL' qemu/target/arm/tcg/psci.c
          strings qemu/build-ios/libqemu-aarch64-softmmu.dylib > ipa8-dylib-strings.txt
          grep -F 'design=ipa8-cal2' ipa8-dylib-strings.txt
          grep -F 'MACPAD_RESET_CAL' ipa8-dylib-strings.txt
          shasum -a 256 qemu/build-ios/libqemu-aarch64-softmmu.dylib > ipa8-dylib.sha256
          git rev-parse HEAD > ipa8-commit.txt
          cp qemu/build-ios.cross.txt ipa8-cross.txt
          cp qemu/build-ios/compile_commands.json ipa8-compile-commands.json

      - name: Build Orchard IPA
        env:
          ORCHARD_NO_ICON: "1"
          ORCHARD_NO_NSIO: "1"
        run: |
          set -o pipefail
          ios/app/build.sh 2>&1 | tee ipa8-app-build.log
          mv ios/app/Orchard.ipa ios/app/Orchard-IPA8-Cal2.ipa
          mkdir ipa8-verify
          unzip -q ios/app/Orchard-IPA8-Cal2.ipa -d ipa8-verify
          cmp qemu/build-ios/libqemu-aarch64-softmmu.dylib ipa8-verify/Payload/Orchard.app/Frameworks/libqemu-aarch64-softmmu.dylib || {
            strings ipa8-verify/Payload/Orchard.app/Frameworks/libqemu-aarch64-softmmu.dylib > ipa8-packaged-strings.txt
            grep -F 'design=ipa8-cal2' ipa8-packaged-strings.txt
            grep -F 'MACPAD_RESET_CAL' ipa8-packaged-strings.txt
          }
          shasum -a 256 ios/app/Orchard-IPA8-Cal2.ipa > ipa8-ipa.sha256

      - name: Upload IPA8 calibration IPA and evidence
        uses: actions/upload-artifact@v4
        with:
          name: Orchard-IPA8-Cal2
          path: |
            ios/app/Orchard-IPA8-Cal2.ipa
            ipa8-*.log
            ipa8-*.txt
            ipa8-*.json
            ipa8-*.sha256
          if-no-files-found: error
